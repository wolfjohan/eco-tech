<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EcoTech AI - Identificador de Residuos Electrónicos</title>
  <meta name="theme-color" content="#0a0f16" />
  
  <!-- Encabezados Anti-Caché -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="manifest" href="/manifest.json" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.025); }
    }
    .animate-hud {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .glow-box {
      box-shadow: 0 0 30px -5px rgba(16, 185, 129, 0.3);
    }
  </style>

  <!-- Sistema Nuevo de Verificación de Contraseña (2028) -->
  <script>
    if (localStorage.getItem('ecotech_access') === '2028' || sessionStorage.getItem('ecotech_access') === '2028') {
      document.write('<style>#authModal { display: none !important; }</style>');
    }

    function checkPassword() {
      var field = document.getElementById('passInput');
      var errorBox = document.getElementById('passError');
      var modal = document.getElementById('authModal');
      
      if (!field) return;
      var val = field.value.trim();

      // Contraseña única: 2028
      if (val === '2028') {
        localStorage.setItem('ecotech_access', '2028');
        sessionStorage.setItem('ecotech_access', '2028');
        if (modal) {
          modal.remove(); // Quita la ventana de la pantalla inmediatamente
        }
      } else {
        if (errorBox) {
          errorBox.style.display = 'block';
        }
        field.value = '';
        field.focus();
      }
    }

    function toggleObjectiveModal(show) {
      var modal = document.getElementById('objectiveModal');
      if (!modal) return;
      if (show) {
        modal.style.display = 'flex';
      } else {
        modal.style.display = 'none';
      }
    }
  </script>
</head>
<body class="bg-[#0a0f16] text-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-6 antialiased selection:bg-brand-500 selection:text-white relative">

  <!-- NUEVA VENTANA DE CONTRASEÑA (Clave: 2028) -->
  <div id="authModal" class="fixed inset-0 z-50 bg-[#070a0f]/95 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-[#111b27] border border-emerald-500/30 rounded-3xl p-7 w-full max-w-md text-center shadow-2xl space-y-5 glow-box">
      
      <!-- Logos en modal -->
      <div class="flex items-center justify-center gap-4">
        <img src="/logo-app.png" alt="EcoTech" class="w-14 h-14 rounded-2xl object-contain border border-emerald-500/40 bg-slate-800/90 p-1 shadow-md" onerror="this.src='/icono.jpg'" />
        <div class="bg-white px-3 py-1.5 rounded-2xl shadow border border-slate-200 flex items-center justify-center">
          <img src="/logo-ecci.png" alt="Universidad ECCI" class="h-10 w-auto object-contain" onerror="this.src='/imagen-removebg-preview(24).png'" />
        </div>
      </div>

      <div>
        <h2 class="text-xl font-bold text-white tracking-wide">Acceso al Sistema EcoTech</h2>
        <p class="text-sm text-slate-300 mt-1.5">Ingresa la contraseña para desbloquear la aplicación.</p>
      </div>

      <!-- Contenedor sin form para evitar recargas en celulares -->
      <div class="space-y-4">
        <div>
          <input 
            type="password" 
            id="passInput" 
            placeholder="Escribe la contraseña" 
            class="w-full py-3.5 px-4 rounded-xl bg-slate-900/90 border border-slate-700 text-white text-base focus:outline-none focus:border-emerald-400 text-center tracking-wider"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            onkeydown="if(event.key === 'Enter') checkPassword();"
          />
          <p id="passError" style="display: none;" class="text-rose-400 text-sm mt-2 font-medium">Contraseña incorrecta. Inténtalo de nuevo.</p>
        </div>

        <button 
          type="button" 
          onclick="checkPassword();"
          class="w-full py-3.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-base shadow-lg shadow-emerald-600/30 transition cursor-pointer">
          Ingresar al Sistema
        </button>
      </div>

      <p class="text-xs text-slate-500">Universidad ECCI • 2026</p>
    </div>
  </div>

  <!-- Botón Flotante Objetivo General -->
  <button id="btnOpenObjective" onclick="toggleObjectiveModal(true)" class="fixed bottom-6 right-6 z-40 py-3 px-4 rounded-full bg-[#101722]/95 hover:bg-[#162232] border border-emerald-500/60 text-emerald-400 font-bold text-xs sm:text-sm flex items-center gap-2 shadow-[0_0_20px_rgba(16,185,129,0.35)] active:scale-95 transition backdrop-blur-md">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-emerald-400 animate-pulse shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>Objetivo</span>
  </button>

  <!-- Modal Flotante de Objetivo General -->
  <div id="objectiveModal" class="fixed inset-0 z-50 bg-[#070a0f]/90 backdrop-blur-md flex items-center justify-center p-4" style="display: none;">
    <div class="bg-[#111b27] border border-emerald-500/40 rounded-3xl p-6 sm:p-7 w-full max-w-md shadow-2xl space-y-4 glow-box relative">
      
      <!-- Botón cerrar X -->
      <button onclick="toggleObjectiveModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-800 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Encabezado Modal -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.
